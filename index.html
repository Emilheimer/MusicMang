<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Web Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player-wrapper">
        <div class="player-card">
            <!-- Runder Cover-Art mit Dreheffekt -->
            <div class="cover-art" id="cover-art">
                <div class="cover-hole"></div> <!-- Loch in der Mitte der "Schallplatte" -->
                <span class="material-symbols-rounded cover-icon">music_note</span>
            </div>
            
            <div class="song-info">
                <h2 id="title">Song Titel</h2>
                <p id="artist">Künstler Name</p>
            </div>
            
            <audio id="audio"></audio>

            <!-- NEU: Zeit-Anzeige -->
            <div class="time-info">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div class="progress-area" id="progress-container">
                <div class="progress-bar" id="progress"></div>
            </div>

            <div class="controls">
                <button id="prev" class="btn-icon"><span class="material-symbols-rounded">skip_previous</span></button>
                <button id="play" class="btn-play"><span class="material-symbols-rounded" id="play-icon">play_arrow</span></button>
                <button id="next" class="btn-icon"><span class="material-symbols-rounded">skip_next</span></button>
            </div>
        </div>

        <div class="playlist-section">
            <!-- NEU: Suchleiste -->
            <div class="search-box">
                <span class="material-symbols-rounded">search</span>
                <input type="text" id="search-input" placeholder="Song oder Künstler suchen...">
            </div>
            <ul id="playlist"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
